---
name: "Release PyPI, Docker and GitHub"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version without the leading 'v'. Leave empty for a build-only dry run."
        default: ""
        type: string
      sha:
        description: "Commit to release. Defaults to the latest commit on main."
        default: ""
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never interrupt a release after it has started publishing.
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"
  PDM_VERSION: "2.29.2"

jobs:
  validate_release:
    name: Validate release inputs
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.release.outputs.target_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Resolve and validate release inputs
        id: release
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_VERSION: ${{ inputs.tag }}
        run: |
          set -u
          target_sha="${RELEASE_SHA:-$(git rev-parse HEAD)}"

          if [[ ! "$target_sha" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "The release commit must be a full 40-character SHA: ${target_sha}" >&2
            exit 1
          fi

          if ! git cat-file -e "${target_sha}^{commit}"; then
            echo "The requested commit does not exist: ${target_sha}" >&2
            exit 1
          fi
          target_sha="$(git rev-parse "${target_sha}^{commit}")"

          if ! git merge-base --is-ancestor "$target_sha" HEAD; then
            echo "The requested commit is not on the main branch: ${target_sha}" >&2
            exit 1
          fi

          if [[ -n "$RELEASE_VERSION" ]]; then
            tag_exists=false
            if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
              echo "Unsupported release version: ${RELEASE_VERSION}" >&2
              echo "Use a version such as 0.4.5 or 0.4.5rc1." >&2
              exit 1
            fi

            if git rev-parse --verify --quiet "refs/tags/v${RELEASE_VERSION}"; then
              tag_sha="$(git rev-list -n 1 "v${RELEASE_VERSION}")"
              if [[ "$tag_sha" != "$target_sha" ]]; then
                echo "Tag v${RELEASE_VERSION} already points to ${tag_sha}, not ${target_sha}." >&2
                exit 1
              fi
              tag_exists=true
              echo "Tag v${RELEASE_VERSION} already points to the requested commit; resuming the release."
            fi

            if ! pypi_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "https://pypi.org/pypi/bypass-url-parser/${RELEASE_VERSION}/json")"; then
              echo "Unable to check whether version ${RELEASE_VERSION} exists on PyPI." >&2
              exit 1
            fi
            if [[ "$pypi_status" == "200" ]]; then
              if [[ "$tag_exists" != "true" ]]; then
                echo "Version ${RELEASE_VERSION} already exists on PyPI without a matching Git tag." >&2
                exit 1
              fi
              echo "Version ${RELEASE_VERSION} already exists on PyPI; resuming the release."
            elif [[ "$pypi_status" != "404" ]]; then
              echo "Unexpected response from PyPI while checking ${RELEASE_VERSION}: HTTP ${pypi_status}" >&2
              exit 1
            fi
          fi

          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"

  sdist_wheels:
    name: Build Python sdist and wheel
    runs-on: ubuntu-latest
    needs: validate_release
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate_release.outputs.target_sha }}
          fetch-depth: 0

      - name: Set local tag for version discovery
        if: ${{ inputs.tag != '' }}
        env:
          RELEASE_VERSION: ${{ inputs.tag }}
        run: |
          if ! git rev-parse --verify --quiet "refs/tags/v${RELEASE_VERSION}"; then
            git tag "v${RELEASE_VERSION}"
          fi

      - uses: actions/setup-python@v6
        name: Setup Python
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: x64

      - name: Install PDM
        run: python -m pip install "pdm==${PDM_VERSION}"

      - name: Check lock file
        run: pdm lock --check

      - name: Build wheel and sdist
        run: pdm build

      - name: Check release artifact versions
        if: ${{ inputs.tag != '' }}
        env:
          RELEASE_VERSION: ${{ inputs.tag }}
        run: |
          test -f "dist/bypass_url_parser-${RELEASE_VERSION}-py3-none-any.whl"
          test -f "dist/bypass_url_parser-${RELEASE_VERSION}.tar.gz"

      - name: Upload wheel and sdist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  tag_release:
    name: Tag release
    runs-on: ubuntu-latest
    needs:
      - validate_release
      - sdist_wheels
    if: ${{ inputs.tag != '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate_release.outputs.target_sha }}
          fetch-depth: 0

      - name: Create and push tag
        env:
          RELEASE_VERSION: ${{ inputs.tag }}
        run: |
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git config user.name "${{ github.actor }} (GitHub Actions)"
          if git rev-parse --verify --quiet "refs/tags/v${RELEASE_VERSION}"; then
            tag_sha="$(git rev-list -n 1 "v${RELEASE_VERSION}")"
            target_sha="$(git rev-parse HEAD)"
            if [[ "$tag_sha" != "$target_sha" ]]; then
              echo "Tag v${RELEASE_VERSION} points to ${tag_sha}, not ${target_sha}." >&2
              exit 1
            fi
          else
            git tag -m "v${RELEASE_VERSION}" "v${RELEASE_VERSION}"
            git push origin "v${RELEASE_VERSION}"
          fi

  upload_release:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    needs:
      - sdist_wheels
      - tag_release
    if: ${{ inputs.tag != '' }}
    environment:
      name: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          verbose: true

  docker_publish:
    name: Push Docker image to ghcr.io
    runs-on: ubuntu-latest
    needs:
      - validate_release
      - sdist_wheels
      - tag_release
    if: ${{ inputs.tag != '' }}
    environment:
      name: release
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate_release.outputs.target_sha }}

      - uses: actions/download-artifact@v7
        name: Download Python artifacts
        with:
          name: dist
          path: dist

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=pep440,value=${{ inputs.tag }},pattern={{version}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  publish_release:
    name: Create draft GitHub release
    runs-on: ubuntu-latest
    needs:
      - sdist_wheels
      - upload_release
      - docker_publish
    if: ${{ inputs.tag != '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
          name: v${{ inputs.tag }}
          tag_name: v${{ inputs.tag }}
